name: nearbite

services:
  db:
    image: postgres:16-alpine
    container_name: nearbite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nearbite
      POSTGRES_PASSWORD: nearbite
      POSTGRES_DB: nearbite
      # 讓 Postgres 以 UTF-8 + 台灣地區設定初始化，排序與全文搜尋對中文較友善
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearbite -d nearbite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
